<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
	<meta charset="utf-8" />
	<title>Array</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="icon.png">
	<!-- the engine: miniPaint (MIT, see UPSTREAM.txt). Its CSS is injected by the bundle at this point, so
	     array.css comes after it and wins ties. -->
	<script src="dist/bundle.js"></script>
	<link rel="stylesheet" href="array.css">
	<script src="array.js" defer></script>
</head>
<body>
	<div class="wrapper">

		<nav aria-label="Main Menu" class="main_menu" id="main_menu"></nav>

		<div class="submenu">
			<a class="logo" href="#" title="Array">Array</a>
			<div class="block attributes" id="action_attributes"></div>
			<button class="undo_button" id="undo_button" type="button">
				<span class="sr_only">Undo</span>
			</button>
		</div>

		<!-- docas: qualquer painel pode ir pra qualquer uma (ou flutuar); array.js cuida do arrastar -->
		<div class="array-dock" id="array_dock_left">
			<div class="block tools array-panel" data-panel="tools">
				<h2 class="array-grip">Tools</h2>
				<div class="sidebar_left" id="tools_container"></div>
			</div>
		</div>

		<div class="middle_area" id="middle_area">

			<canvas class="ruler_left" id="ruler_left"></canvas>
			<canvas class="ruler_top" id="ruler_top"></canvas>

			<div class="main_wrapper" id="main_wrapper">
				<div class="canvas_wrapper" id="canvas_wrapper">
					<div id="mouse"></div>
					<div class="transparent-grid" id="canvas_minipaint_background"></div>
					<canvas id="canvas_minipaint">
						<div class="trn error">
							Your browser does not support canvas or JavaScript is not enabled.
						</div>
					</canvas>
				</div>
			</div>
		</div>

		<div class="sidebar_right array-dock" id="array_dock_right">
			<div class="preview block array-panel" data-panel="navigator">
				<h2 class="trn toggle array-grip" data-target="toggle_preview">Navigator</h2>
				<div id="toggle_preview"></div>
			</div>

			<div class="colors block array-panel" data-panel="color">
				<h2 class="trn toggle array-grip" data-target="toggle_colors">Color</h2>
				<div class="content" id="toggle_colors"></div>
			</div>

			<div class="block array-panel" id="info_base" data-panel="info">
				<h2 class="trn toggle toggle-full array-grip" data-target="toggle_info">Info</h2>
				<div class="content" id="toggle_info"></div>
			</div>

			<div class="details block array-panel" id="details_base" data-panel="properties">
				<h2 class="trn toggle toggle-full array-grip" data-target="toggle_details">Properties</h2>
				<div class="content details-content" id="toggle_details"></div>
			</div>

			<div class="layers block array-panel" data-panel="layers">
				<h2 class="trn array-grip">Layers</h2>
				<div class="array-blend" id="array_blend">
					<select id="array_blend_mode" title="Blending mode"></select>
					<label title="Opacity"><input id="array_blend_opacity" type="number" min="0" max="100" step="1"><span>%</span></label>
				</div>
				<div class="content" id="layers_base"></div>
			</div>
		</div>
	</div>
	<div class="mobile_menu">
		<button class="left_mobile_menu" id="left_mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
		<button class="right_mobile_menu" id="mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
	</div>
	<div class="hidden" id="tmp"></div>
	<div id="popups"></div>
	<div id="array_status" aria-live="polite"></div>
</body>
</html>
